<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas y Respuestas</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/juego_mobil.css">
</head>

<body id="preguntasRespuestas">
    <header>
        <img id="pregunta" src="../../css/icon/pregunta.png" alt="imagenPreguntasRespuestas">
        <h1>PREGUNTAS Y RESPUESTAS</h1>
        <p id="tiempo">Tiempo: 00:</p>
    </header>
    <main>
        <h2 id="tituloPregunta">¿Pregunta X?</h2>
        <section id="opcionesPregunta">
            <div class="contenedor-pregunta">
                <input type="radio" name="preguntaX">
                <p>Respuesta 1</p>
            </div>
            <div class="contenedor-pregunta">
                <input type="radio" name="preguntaX">
                <p>Respuesta 2</p>
            </div>
            <div class="contenedor-pregunta">
                <input type="radio" name="preguntaX">
                <p>Respuesta 3</p>
            </div>
        </section>
        <button id="btnEnviar" style="display: none;">ENVIAR</button>
        <button id="btnPasar" style="display: none;">PASAR</button>
    </main>
    <div id="popUp"></div>
    <div id="overlay"></div>
    <script type="module" src="../../js/app.js"></script>
</body>

</html>
