<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="stylesheet" href="../../css/juego_mobil.css">
        <title>Registro</title>
    </head>
    <body id="registro">
        <header>
            <h1>REGISTRO DE USUARIO</h1>
        </header>
        <main>
            <form action="../../../test/registrarDatos.php" method="POST" id="formularioLoguin">
                <p id="aviso"></p>
                <label>Nombre de Usuario:</label>
                <input type="text" id="nombreUsuario" name="nombre" placeholder="Nombre de Usuario">
                <label>Correo:</label>
                <input type="email" id="email" name="mail" placeholder="usuario@gmail.com">
                <label>Nick:</label>
                <input type="text" id="nick" placeholder="Nick" name="nick">
                <label>clave:</label>
                <input type="text" id="clave" placeholder="Clave de usuario " name="clave">
                <button id="btnEnviar" class="botones_juego">ENVIAR</button>
            </form>
        </main>
        <script type="module" src="../../js/app.js"></script>
    </body>
</html>
